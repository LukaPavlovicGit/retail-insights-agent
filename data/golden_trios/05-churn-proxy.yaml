question: Why did our churn rate spike last month?
tags: [all]
author: seed-analyst
created_at: 2026-01-18
sql: |
  WITH last_buy AS (
    SELECT oi.user_id, MAX(DATE(oi.created_at)) AS last_purchase
    FROM `bigquery-public-data.thelook_ecommerce.order_items` oi
    JOIN `bigquery-public-data.thelook_ecommerce.products` p ON p.id = oi.product_id
    WHERE oi.status NOT IN ('Cancelled', 'Returned')
    GROUP BY 1
  ),
  months AS (
    SELECT DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL n MONTH) AS month_end
    FROM UNNEST(GENERATE_ARRAY(0, 12)) AS n
  )
  SELECT m.month_end,
         COUNTIF(lb.last_purchase < DATE_SUB(m.month_end, INTERVAL 90 DAY)) AS churned,
         COUNT(*) AS customers_seen,
         ROUND(SAFE_DIVIDE(COUNTIF(lb.last_purchase < DATE_SUB(m.month_end, INTERVAL 90 DAY)), COUNT(*)), 3) AS churn_rate
  FROM months m
  CROSS JOIN last_buy lb
  WHERE lb.last_purchase <= m.month_end
  GROUP BY 1
  ORDER BY 1
report: |
  The dataset has no subscriptions, so churn is a proxy: churn = no purchase in the last 90 days
  as of each month end; state the definition in the answer. A spike has three usual
  causes: a promotion the month before pulled in one-time buyers, a stock-out in a repeat
  category, or a seasonal effect. Check the previous month's new-customer share first. Action:
  Marketing designs a second-purchase offer for the cohort that lapsed.
