question: Why did our churn rate spike last month?
tags: [all]
author: seed-analyst
created_at: 2026-01-18
sql: |
  WITH monthly AS (
    SELECT DATE_TRUNC(DATE(oi.created_at), MONTH) AS month, oi.user_id
    FROM `bigquery-public-data.thelook_ecommerce.order_items` oi
    JOIN `bigquery-public-data.thelook_ecommerce.products` p ON p.id = oi.product_id
    WHERE oi.status NOT IN ('Cancelled', 'Returned')
    GROUP BY 1, 2
  ),
  active AS (
    SELECT m.month, COUNT(DISTINCT m.user_id) AS active_customers,
           COUNT(DISTINCT IF(prev.user_id IS NULL, NULL, m.user_id)) AS retained_from_prev
    FROM monthly m
    LEFT JOIN monthly prev ON prev.user_id = m.user_id AND prev.month = DATE_SUB(m.month, INTERVAL 1 MONTH)
    GROUP BY 1
  )
  SELECT month, active_customers, retained_from_prev,
         ROUND(1 - SAFE_DIVIDE(retained_from_prev, LAG(active_customers) OVER (ORDER BY month)), 3) AS churn_rate
  FROM active
  WHERE month >= DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL 13 MONTH)
  ORDER BY month
report: |
  The dataset has no subscriptions, so churn is a proxy: the share of last month's buyers who
  did not buy again this month. State the definition before the number. A spike has three usual
  causes: a promotion the month before pulled in one-time buyers, a stock-out in a repeat
  category, or a seasonal effect. Check the previous month's new-customer share first. Action:
  Marketing designs a second-purchase offer for the cohort that lapsed.
