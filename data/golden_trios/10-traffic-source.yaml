question: Which traffic sources bring the most valuable customers?
tags: [all]
author: seed-analyst
created_at: 2026-01-28
sql: |
  SELECT u.traffic_source,
         COUNT(DISTINCT oi.user_id) AS customers,
         ROUND(SUM(oi.sale_price), 2) AS revenue,
         ROUND(SUM(oi.sale_price) / COUNT(DISTINCT oi.user_id), 2) AS revenue_per_customer,
         ROUND(COUNT(DISTINCT oi.order_id) / COUNT(DISTINCT oi.user_id), 2) AS orders_per_customer
  FROM `bigquery-public-data.thelook_ecommerce.order_items` oi
  JOIN `bigquery-public-data.thelook_ecommerce.users` u ON u.id = oi.user_id
  JOIN `bigquery-public-data.thelook_ecommerce.products` p ON p.id = oi.product_id
  WHERE oi.status NOT IN ('Cancelled', 'Returned')
    AND oi.created_at >= TIMESTAMP(DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH))
  GROUP BY 1
  ORDER BY revenue_per_customer DESC
report: |
  Value per customer, not volume, decides where to spend. Rank sources by revenue per customer
  and orders per customer, then note which source brings the most customers overall. Action:
  Marketing shifts budget toward the source with the highest value per customer as long as it
  has room to grow.
