question: Why are customers in state X underspending, and how do they compare to customers in state Y?
tags: [all]
author: seed-analyst
created_at: 2026-01-20
sql: |
  SELECT u.state,
         COUNT(DISTINCT oi.user_id) AS customers,
         COUNT(DISTINCT oi.order_id) AS orders,
         ROUND(SUM(oi.sale_price), 2) AS revenue,
         ROUND(SUM(oi.sale_price) / COUNT(DISTINCT oi.user_id), 2) AS revenue_per_customer,
         ROUND(SUM(oi.sale_price) / COUNT(DISTINCT oi.order_id), 2) AS aov,
         ROUND(COUNT(oi.id) / COUNT(DISTINCT oi.order_id), 2) AS items_per_order,
         ROUND(SAFE_DIVIDE(COUNTIF(oi.status = 'Returned'), COUNT(oi.id)), 3) AS return_rate
  FROM `bigquery-public-data.thelook_ecommerce.order_items` oi
  JOIN `bigquery-public-data.thelook_ecommerce.users` u ON u.id = oi.user_id
  JOIN `bigquery-public-data.thelook_ecommerce.products` p ON p.id = oi.product_id
  WHERE u.state IN ('X', 'Y')
    AND oi.created_at >= TIMESTAMP(DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH))
  GROUP BY 1
report: |
  Decompose revenue per customer into orders per customer, items per order, and price per item.
  "Underspending" is almost always one of those three, and the fix differs: fewer orders is a
  retention issue, fewer items is a bundling issue, lower price per item is a mix issue. Compare
  the category mix of both states before concluding. Action: name the lever and the owner.
