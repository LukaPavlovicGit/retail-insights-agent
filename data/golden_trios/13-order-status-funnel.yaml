question: How are orders flowing through statuses in the last 30 days?
tags: [all]
author: seed-analyst
created_at: 2026-02-05
sql: |
  SELECT o.status,
         COUNT(DISTINCT o.order_id) AS orders,
         ROUND(SUM(oi.sale_price), 2) AS revenue
  FROM `bigquery-public-data.thelook_ecommerce.orders` o
  JOIN `bigquery-public-data.thelook_ecommerce.order_items` oi ON oi.order_id = o.order_id
  JOIN `bigquery-public-data.thelook_ecommerce.products` p ON p.id = oi.product_id
  WHERE o.created_at >= TIMESTAMP(DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
  GROUP BY 1
  ORDER BY orders DESC
report: |
  Statuses are Complete, Shipped, Processing, Cancelled, and Returned. Report the cancelled and
  returned shares as the two leak points. A rising Processing share means fulfilment is slowing.
  Action: Operations owns Processing age; Customer Experience owns cancellations.
