[project]
name = "ria"
version = "0.1.0"
description = "Retail Insights Agent: a data-analysis chat assistant over BigQuery with LangGraph, MCP and Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-mcp-adapters>=0.2",
    "mcp>=1.20",
    "google-genai>=1.30",
    "google-cloud-bigquery[pandas]>=3.30",
    "db-dtypes>=1.3",
    "sqlite-vec>=0.1.6",
    "sqlglot>=27",
    "pydantic>=2.10",
    "pyyaml>=6",
    "rich>=14",
    "prompt-toolkit>=3.0.50",
    "typer>=0.15",
    "python-dotenv>=1.1",
]

[project.scripts]
ria = "ria.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ria"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs network credentials"]
